<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>push</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;background:#000;color:#f7f7f8}
    body{
      display:grid;place-items:center;padding:24px;
      font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
      text-align:center;
    }
    .wrap{max-width:300px}
    .brand{font-size:40px;font-weight:760;letter-spacing:-2px}
    .copy{margin-top:12px;color:#77777e;font-size:13px;line-height:1.5}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="brand">push</div>
    <div class="copy">인터넷 연결이 필요해. 연결되면 다시 열어줘.</div>
  </main>
</body>
</html>
